name: Deploy landing page

# Builds the Astro landing page in web/ and publishes it to Cloudflare Pages
# at https://dcli.pages.dev (project `dcli`).
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read

# One in-flight deploy at a time; don't cancel a running publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    environment:
      name: cloudflare-pages
      url: https://dcli.pages.dev
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      # `pages deploy`, NOT bare `wrangler deploy` — the latter treats this as
      # a Worker, runs `astro add cloudflare`, and fails on _worker.js assets.
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          bunx wrangler pages deploy dist \
            --project-name dcli \
            --branch main \
            --commit-hash "$GITHUB_SHA"
