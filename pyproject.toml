[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "donghua-cli"
version = "4.0.0"
description = "Wuxia-themed terminal client for streaming Chinese animation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
keywords = ["donghua", "anime", "streaming", "cli", "terminal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "curl_cffi>=0.7.0",
    "selectolax>=0.3.21",
    "rich>=13.0.0",
    "textual>=8.2.7,<9",
    "diskcache>=5.6.0",
    "platformdirs>=4.0.0",
]

[project.urls]
Homepage = "https://dcli.pages.dev"
Repository = "https://github.com/Thanukamax/donghua-cli"
Issues = "https://github.com/Thanukamax/donghua-cli/issues"

[project.optional-dependencies]
download = ["yt-dlp>=2023.0.0"]
covers = ["rich-pixels>=2.0.0", "Pillow>=10.0.0"]
dev = ["ruff", "pyright", "pytest", "respx"]

[project.scripts]
donghua = "donghua_cli.cli:main"
dhua = "donghua_cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/donghua_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
src = ["src"]
target-version = "py39"

[tool.ruff.lint]
# Pinned explicitly to the set this project has always enforced. Ruff's
# *default* selection is not stable across minor releases — 0.16 switched on
# SIM, PLW and others, which turned 125 pre-existing style findings into a red
# CI on an unchanged codebase. Naming the rules keeps the gate meaning the same
# thing regardless of which ruff a fresh `pip install -e ".[dev]"` resolves.
select = ["E4", "E7", "E9", "F"]
